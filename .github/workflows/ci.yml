name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify stealth fetcher dependencies
        run: python -c "from scrapling.fetchers import StealthyFetcher, DynamicFetcher"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Install Python client
        run: |
          cd clients/python
          python -m pip install -e ".[dev]"
      - name: Python client Ruff
        run: |
          cd clients/python
          ruff check .
      - name: Python client Tests
        run: |
          cd clients/python
          pytest
