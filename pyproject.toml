[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veda"
version = "0.1.0"
description = "Caller-agnostic MCP server for public Reddit and web reads — structured JSON from threads, users, rules, and any public URL."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "reddit", "scraping", "web-reader"]
dependencies = [
  "lxml>=5.0",
  "mcp>=1.0",
  "requests>=2.31",
  "scrapling[fetchers]>=0.4",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/BarterX-Tech/veda-mcp"
Issues = "https://github.com/BarterX-Tech/veda-mcp/issues"

[project.scripts]
veda-mcp = "veda.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["veda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
