[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veda"
version = "0.1.0"
description = "Standalone Reddit and web scraping MCP service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0",
  "mcp>=1.0",
  "requests>=2.31",
  "scrapling>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
veda-mcp = "veda.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["veda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
